callouts:
- type: definition
  title: Internalism Vs Externalism Epistemology
  body: The Internalism Vs Externalism Epistemology debate concerns whether the factors
    that determine epistemic justification are confined to the believer's internal
    mental states or also include external conditions such as causal reliability.
- type: key-claim
  title: Key claim about Internalism Vs Externalism Epistemology
  body: 'The Internalism Vs Externalism Epistemology debate is structurally important
    because it forces a choice between two attractive but incompatible commitments:
    that justification be reflectively available to the believer and that justification
    be reliably connected to truth.'
- type: warning
  title: Common pitfall regarding Internalism Vs Externalism Epistemology
  body: The Internalism Vs Externalism Epistemology debate is sometimes treated as
    a clean binary, but contemporary positions are typically hybrids; speaking as
    if every epistemologist must be a "pure" internalist or externalist misrepresents
    the actual landscape of the dispute.
