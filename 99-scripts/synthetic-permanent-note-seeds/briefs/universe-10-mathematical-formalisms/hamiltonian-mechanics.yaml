callouts:
- type: definition
  title: Hamiltonian Mechanics
  body: Hamiltonian Mechanics is the reformulation of classical mechanics, due to
    Hamilton (1833), in which the state is described by 2n canonical coordinates (q^i,
    p_i) on phase space and dynamics is generated by the Hamiltonian H(q, p, t) (typically
    the total energy) via Hamilton's equations q̇^i = ∂H/∂p_i, ṗ_i = −∂H/∂q^i — providing
    the symplectic-geometric foundation of mechanics.
- type: key-claim
  title: Key claim about Hamiltonian Mechanics
  body: Hamiltonian Mechanics is the natural starting point for the canonical quantisation
    procedure (replacing Poisson brackets with commutators yields the canonical commutation
    relations of quantum mechanics) and for statistical mechanics (the Hamiltonian
    generates time evolution of the phase-space distribution via the Liouville equation).
- type: warning
  title: Common pitfall regarding Hamiltonian Mechanics
  body: Hamiltonian Mechanics requires a non-degenerate Lagrangian for the Legendre
    transform from velocities to momenta to be well-defined; degenerate Lagrangians
    (gauge theories, general relativity, constrained systems) require the more elaborate
    Dirac–Bergmann constraint formalism, and presenting Hamiltonian mechanics as universally
    applicable without acknowledging this complication understates the technical issues
    for the most physically important systems.
