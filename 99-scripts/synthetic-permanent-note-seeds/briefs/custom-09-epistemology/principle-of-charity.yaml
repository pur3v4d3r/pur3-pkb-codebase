callouts:
- type: definition
  title: Principle of Charity
  body: The Principle of Charity is the interpretive norm requiring that, when interpreting
    another's claims or arguments, one assign the strongest plausible reading consistent
    with the words and context — minimizing attributed error and maximizing the rationality
    and coherence of the interpretee's position.
- type: key-claim
  title: Key claim about Principle of Charity
  body: 'The Principle of Charity is justified instrumentally on epistemic grounds:
    charitable interpretation produces better critical engagement because attacking
    a weakened version of a view (a "strawman") leaves the strongest version intact,
    whereas refuting the steelmanned version generated by the Principle of Charity
    is a stronger refutation that also better serves the critic''s own learning.'
- type: warning
  title: Common pitfall regarding Principle of Charity
  body: The Principle of Charity has limits and can be misapplied when "charitably"
    reading a position requires inserting premises the author did not hold or ignoring
    textual evidence of the actual argument; mechanically applied, the Principle of
    Charity can become a license to substitute one's preferred view for the interpretee's,
    producing a different failure mode from strawmanning but no less serious.
