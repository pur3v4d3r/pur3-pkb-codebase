callouts:
- type: definition
  title: Worked Examples
  body: Worked Examples are instructional artifacts that present a problem together
    with its complete, step-by-step solution and the reasoning that justifies each
    step, so that the learner studies a fully demonstrated trace rather than searching
    for the solution unaided. Within [[cognitive-load-theory]] they are the canonical
    instructional vehicle for substituting [[germane-cognitive-load]] (productive
    [[schema-construction]]) for the [[extraneous-cognitive-load]] generated by means-ends
    search during conventional problem-solving.
- type: key-claim
  title: Key claim about Worked Examples
  body: Worked Examples produce faster and more durable [[schema-construction]] than
    equivalent practice problems for novices because they free [[working-memory]]
    from the search load imposed by the means-ends strategy, allowing the learner
    to attend instead to the structural relations that constitute the target schema
    — a finding canonized as [[the-worked-example-effect]] and one of the most replicated
    results in instructional psychology.
- type: warning
  title: Common pitfall regarding Worked Examples
  body: Worked Examples lose their advantage and can actively harm learning once the
    learner has acquired the target schema, because the now-redundant explanatory
    material itself becomes [[extraneous-cognitive-load]]; this reversal — the [[expertise-reversal-effect]]
    — means Worked Examples must be progressively faded into completion problems and
    then independent practice as expertise grows, rather than used as a fixed instructional
    default.
