callouts:
- type: definition
  title: Open Science Practices
  body: Open Science Practices is a cluster of methodological reforms — preregistration,
    registered reports, open data, open materials, open code, and open access publishing
    — adopted in response to the replication crisis to constrain researcher degrees
    of freedom, enable independent verification, and align the published record more
    closely with the underlying empirical reality.
- type: key-claim
  title: Key claim about Open Science Practices
  body: 'Open Science Practices'' most evidentially supported component is preregistration
    combined with the registered-reports format: registered-reports studies show a
    dramatically lower rate of statistically significant "positive" findings (roughly
    40% versus 90% in matched conventional samples), suggesting that the conventional
    literature''s success rate is driven less by veridical signal than by selective
    reporting and analytic flexibility that Open Science Practices are specifically
    designed to remove.'
- type: warning
  title: Common pitfall regarding Open Science Practices
  body: 'Open Science Practices are sometimes treated as procedural fixes that automatically
    produce credible science, but several of their components can be performed in
    ways that satisfy the letter without the spirit: vague preregistrations are common
    and provide little constraint, "open" data are often released in formats that
    resist independent reanalysis, and exploratory work mislabeled as confirmatory
    passes through registered-report systems whose protections depend on analyst honesty
    about the inferential intent of each test.'
