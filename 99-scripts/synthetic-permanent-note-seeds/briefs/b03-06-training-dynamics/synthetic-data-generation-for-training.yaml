callouts:
- type: definition
  title: Synthetic Data Generation for Training
  body: Synthetic Data Generation for Training refers to the use of large language
    models (or other generative models) to generate training data for downstream machine
    learning tasks — producing labelled examples, reasoning chains, preference pairs,
    or instruction-following demonstrations that supplement or replace human-annotated
    training data. Synthetic data generation methods include self-instruct (generating
    instruction-following examples using an LLM prompted with seed instructions),
    bootstrapped annotation (using a capable model to generate labels for unlabelled
    examples), constitutional AI data generation (generating self-critiqued revisions
    as preference training data), and model-generated reasoning chains (using chain-of-thought
    prompting to generate reasoning annotations for fine-tuning). Synthetic data has
    become a primary training data source for instruction tuning, RLHF preference
    data, and reasoning data, addressing the scalability and cost limitations of human
    annotation.
- type: key-claim
  title: Key claim about Synthetic Data Generation for Training
  body: Synthetic Data Generation for Training enables capability improvements beyond
    what human annotation alone can provide — self-instruct and related synthetic
    data methods have demonstrated that fine-tuning smaller models on LLM-generated
    instruction data produces instruction-following capabilities comparable to or
    exceeding models fine-tuned on human-annotated data of similar scale, and synthetic
    reasoning chain data has enabled reasoning capability improvements in smaller
    models that did not emerge from pretraining alone; these results suggest that
    synthetic data quality is sufficient to transfer capabilities from a capable teacher
    model to a student model through imitation learning on generated data.
- type: warning
  title: Common pitfall regarding Synthetic Data Generation for Training
  body: Synthetic Data Generation for Training risks amplifying the failure modes
    and biases of the generating model through training data distribution — models
    trained on synthetic data generated by a biased or capability-limited teacher
    model will learn and potentially amplify the teacher's systematic errors, and
    iterative self-improvement through synthetic data (model generates data, model
    trains on its own generated data) can accelerate both capability improvement and
    bias amplification through feedback loops; synthetic data quality verification
    against human annotation standards is required to identify systematic biases before
    they are amplified through training.
