callouts:
- type: definition
  title: Affect Heuristic
  body: The Affect Heuristic is a mental shortcut, characterized by Paul Slovic and
    colleagues, in which people consult an immediate affective evaluation — a "good"
    or "bad" feeling about an object — and use it as the basis for judgments about
    that object's risks, benefits, and probabilities.
- type: key-claim
  title: Key claim about Affect Heuristic
  body: The Affect Heuristic produces a robust inverse correlation between perceived
    risk and perceived benefit for the same object, even though risks and benefits
    are objectively positively correlated in the world; this anti-correlation is a
    signature finding because it cannot be generated by any rational model that treats
    affect as separate from probability assessment.
- type: warning
  title: Common pitfall regarding Affect Heuristic
  body: The Affect Heuristic is sometimes treated as automatically irrational, but
    affect frequently encodes genuine experiential information; the bias appears not
    in using affect at all but in treating affect as a sufficient summary when its
    evidentiary basis is thin or when the decision domain is sufficiently novel that
    affective tags lack diagnostic value.
