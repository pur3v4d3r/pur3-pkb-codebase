callouts:
- type: definition
  title: Context Distillation Training
  body: Context Distillation Training refers to the process of fine-tuning a language
    model on input-output pairs generated by a teacher model processing full context
    prompts, with the goal of training the student model to produce equivalent outputs
    when given only a minimal (or absent) context prompt — effectively distilling
    the information in the in-context examples or document context into the model's
    parameters. Context distillation enables deployment of models that behave as if
    they have access to complex in-context knowledge without requiring that knowledge
    to be included in every inference prompt, reducing inference token cost and latency
    while achieving quality comparable to in-context prompting. It is used to compress
    few-shot in-context learning into zero-shot fine-tuned behaviour and to incorporate
    system-level instructions into model parameters rather than prompt tokens.
- type: key-claim
  title: Key claim about Context Distillation Training
  body: Context Distillation Training successfully transfers in-context instruction
    following into model parameters — experiments distilling system-level instruction
    prompts (e.g., "respond helpfully and harmlessly") into model weights via fine-tuning
    on teacher model outputs show that distilled models exhibit instruction-following
    behaviour equivalent to prompted models on the distilled instruction domain without
    requiring the instruction prompt at inference time, reducing average prompt token
    count by 30–70% for instruction-heavy deployments; Constitutional AI specifically
    uses context distillation to incorporate constitutional principles into model
    behaviour without requiring the full constitutional prompt at every inference
    step.
- type: warning
  title: Common pitfall regarding Context Distillation Training
  body: Context Distillation Training creates rigid, hard-to-update knowledge embedding
    — information distilled into model parameters cannot be updated without retraining,
    unlike in-context information which can be updated by modifying the prompt; for
    use cases where the distilled context represents frequently changing information
    (current guidelines, evolving policies, updated factual knowledge), context distillation
    training is inappropriate because the distilled knowledge will become stale and
    retraining is required for each update, making in-context provision more practical
    for dynamic information despite its higher per-inference token cost.
