callouts:
- type: definition
  title: Zettelkasten
  body: The Zettelkasten ("slip-box") is the note-taking method developed by sociologist
    Niklas Luhmann in which each idea is captured as an atomic note, given a stable
    identifier, linked richly to related notes, and accumulated over time into an
    associatively-traversable knowledge base — a method credited with enabling Luhmann's
    exceptional scholarly output across decades.
- type: key-claim
  title: Key claim about Zettelkasten
  body: 'The Zettelkasten''s productivity dividend comes not from any individual note
    but from the *network* of links: the same atomic note becomes more valuable as
    it acquires more links into more contexts, and the slip-box becomes a *thinking
    partner* whose unexpected juxtapositions surface ideas the author would not have
    generated by linear thinking — which is why Zettelkasten enthusiasts emphasise
    linking discipline over capture volume.'
- type: warning
  title: Common pitfall regarding Zettelkasten
  body: The Zettelkasten can degenerate into "collector's fallacy" — accumulating
    notes whose mere existence is mistaken for knowledge — if practitioners do not
    actually *work* with their notes through writing, restructuring, and explicit
    linking; a Zettelkasten of ten thousand isolated atomic notes is less useful than
    one of two hundred well-linked notes the author actively reasons through.
