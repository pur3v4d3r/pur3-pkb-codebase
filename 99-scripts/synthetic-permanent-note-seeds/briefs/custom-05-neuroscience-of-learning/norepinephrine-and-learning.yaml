callouts:
- type: definition
  title: Norepinephrine and Learning
  body: Norepinephrine and Learning refers to the role of the noradrenergic system
    — projecting from the locus coeruleus to the amygdala, hippocampus, and cortex
    — in tagging arousing, surprising, or behaviorally significant events for enhanced
    consolidation through phasic noradrenaline release at encoding.
- type: key-claim
  title: Key claim about Norepinephrine and Learning
  body: 'Norepinephrine and Learning research shows an inverted-U relationship between
    noradrenergic activation and memory performance: too little produces under-encoding,
    too much produces over-consolidation of central detail at the expense of peripheral
    context, the Yerkes-Dodson curve at the cellular level.'
- type: warning
  title: Common pitfall regarding Norepinephrine and Learning
  body: Norepinephrine and Learning is often invoked to justify "high-arousal study"
    interventions, but the inverted-U is steep and individual differences are large,
    so generic "make studying exciting" advice can land learners on either side of
    the optimum without principled calibration.
