callouts:
- type: definition
  title: Syllogism
  body: A Syllogism is a deductive argument consisting of two premises and a conclusion,
    in which the conclusion is derived from the premises by a fixed inferential pattern;
    the term originates with Aristotle and dominates the pre-modern logical tradition.
- type: key-claim
  title: Key claim about Syllogism
  body: A Syllogism makes the structural commitments of an inference explicit by isolating
    exactly two premises that jointly entail the conclusion; this minimalism is what
    allowed ancient and medieval logicians to enumerate valid inference patterns systematically.
- type: warning
  title: Common pitfall regarding Syllogism
  body: A Syllogism is sometimes treated as the universal form of deductive reasoning,
    but contemporary logic recognises many valid inference patterns that exceed two-premise
    structure; treating syllogistic form as exhaustive misrepresents the scope of
    deductive logic.
