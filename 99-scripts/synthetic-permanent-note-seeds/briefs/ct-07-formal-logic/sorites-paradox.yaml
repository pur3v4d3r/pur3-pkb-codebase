callouts:
- type: definition
  title: Sorites Paradox
  body: The Sorites Paradox is the puzzle generated by chaining together intuitively
    true premises about vague predicates ("a heap of sand minus one grain is still
    a heap") to produce an unacceptable conclusion ("a single grain is a heap"); each
    step seems obvious but the cumulative reasoning fails.
- type: key-claim
  title: Key claim about Sorites Paradox
  body: The Sorites Paradox shows that vague predicates resist treatment by classical
    logic; either the seemingly obvious tolerance principles must be denied, classical
    logic must be revised (e.g., to many-valued or fuzzy logics), or the law of excluded
    middle must be qualified for vague terms.
- type: warning
  title: Common pitfall regarding Sorites Paradox
  body: The Sorites Paradox is sometimes dismissed as a verbal trick, but it has generated
    a substantial technical literature precisely because every proposed solution carries
    significant cost; treating it as a mere word game ignores that vagueness is a
    pervasive property of natural-language predicates.
