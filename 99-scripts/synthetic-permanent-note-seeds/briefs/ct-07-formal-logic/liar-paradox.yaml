callouts:
- type: definition
  title: Liar Paradox
  body: The Liar Paradox is the puzzle generated by self-referential sentences such
    as "this sentence is false," which appear to be true if and only if they are false;
    the paradox shows that naive principles of truth and self-reference are jointly
    inconsistent.
- type: key-claim
  title: Key claim about Liar Paradox
  body: The Liar Paradox forced the development of formal theories of truth that block
    self-application (Tarski's hierarchy) or revise classical logic (paracomplete
    and paraconsistent approaches); without one of these moves, a natural language
    with both a truth predicate and unrestricted self-reference is provably inconsistent.
- type: warning
  title: Common pitfall regarding Liar Paradox
  body: The Liar Paradox should not be filed away as a curiosity; structurally similar
    paradoxes (Curry's, Yablo's, the strengthened liar) reappear in any system rich
    enough to express its own semantics, so any theory of truth must take a position
    on them whether explicitly or by default.
