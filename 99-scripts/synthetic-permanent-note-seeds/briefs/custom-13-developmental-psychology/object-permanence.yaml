callouts:
- type: definition
  title: Object Permanence
  body: Object Permanence is the understanding that objects continue to exist when
    they are no longer perceptible — out of sight, hearing, or touch — identified
    by Piaget as a major sensorimotor-stage achievement attained gradually across
    the first two years of life.
- type: key-claim
  title: Key claim about Object Permanence
  body: 'Subsequent infant-cognition research using violation-of-expectation paradigms
    has dramatically revised the Object Permanence timeline: looking-time studies
    suggest infants as young as three to four months represent occluded objects, indicating
    that Piaget''s reaching-based tasks underestimated competence by conflating Object
    Permanence with the motor and inhibitory demands of search.'
- type: warning
  title: Common pitfall regarding Object Permanence
  body: The mature Object Permanence literature is now divided over whether early
    looking-time successes reflect genuine conceptual representation of hidden objects
    or low-level perceptual mechanisms; treating Object Permanence as either fully
    present at three months or fully absent before eight months ignores the dissociation
    between recognition and action that the data actually show.
