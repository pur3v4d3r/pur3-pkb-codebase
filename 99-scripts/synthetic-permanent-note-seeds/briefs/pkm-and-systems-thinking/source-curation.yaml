callouts:
- type: definition
  title: Source Curation
  body: Source Curation is the deliberate, ongoing practice of selecting, retaining,
    pruning, and organizing the corpus of information sources that feed a knowledge
    worker's intake stream — newsletters, feeds, podcasts, books, archives, and recurring
    search queries — distinguished from one-off source evaluation by its focus on
    the steady-state composition of the information diet rather than on any single
    source-evaluation decision.
- type: key-claim
  title: Key claim about Source Curation
  body: 'Source Curation has outsized leverage on long-run intellectual output because
    the intake corpus determines the hypothesis space of ideas the worker will generate:
    weak Source Curation raises the floor of effort needed to find good ideas (because
    most attention is spent filtering), while strong Source Curation raises the ceiling
    of what ideas can be generated by ensuring the inputs themselves are dense in
    usable signal.'
- type: warning
  title: Common pitfall regarding Source Curation
  body: 'Source Curation is often deferred indefinitely on the implicit theory that
    all sources should be evaluated on their merits at point of consumption, but this
    strategy ignores attention as a finite resource: each unfiltered source consumes
    attention that the curated alternative would have used to better effect, so the
    choice not to curate is a choice to allocate attention by default rather than
    by intention.'
