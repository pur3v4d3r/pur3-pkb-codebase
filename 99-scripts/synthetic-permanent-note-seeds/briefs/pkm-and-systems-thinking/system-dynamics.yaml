callouts:
- type: definition
  title: System Dynamics
  body: System Dynamics is the modeling methodology developed by Jay Forrester at
    MIT for representing and simulating the behavior of complex feedback systems through
    stocks (accumulations), flows (rates of change), feedback loops, and time delays
    — providing a quantitative language in which counterintuitive dynamic behavior
    of social, ecological, and industrial systems can be derived from the structural
    relations among their components.
- type: key-claim
  title: Key claim about System Dynamics
  body: System Dynamics' central explanatory contribution is the demonstration that
    system behavior over time is determined more by the structure of feedback and
    accumulation than by the magnitudes of any single variable, with the corollary
    that interventions targeting variables (rather than feedback structure) tend to
    be defeated by the system's compensatory dynamics — the underlying logic of "policy
    resistance" in complex social systems.
- type: warning
  title: Common pitfall regarding System Dynamics
  body: 'System Dynamics models are sometimes treated as predictive when their primary
    epistemic warrant is structural-explanatory: they show how observed dynamic patterns
    could be generated by hypothesized feedback structures, not what specific quantities
    will obtain at specific future times; treating their numerical outputs as forecasts
    overstates the methodology''s calibration and invites disappointment that is mistaken
    for refutation.'
