callouts:
- type: definition
  title: Dynamic Benchmarking
  body: 'Dynamic benchmarking refers to evaluation methodologies that generate new
    evaluation instances at test time rather than using a fixed set of evaluation
    examples, preventing benchmark contamination and enabling ongoing capability assessment
    as models improve. Dynamic benchmark approaches include: generative evaluation
    (using a separate model or human evaluators to generate novel evaluation instances
    at inference time), procedurally generated benchmarks (using formal grammars or
    code to generate infinite novel instances of defined task types), rotating benchmark
    pools (maintaining a large private pool and sampling fresh subsets for each evaluation
    round), and adversarial benchmarking (generating evaluation instances specifically
    targeting model weaknesses identified in previous rounds).'
- type: key-claim
  title: Key claim about Dynamic Benchmarking
  body: Dynamic benchmarking is necessary but not sufficient for addressing the capability
    assessment problem — eliminating benchmark contamination by generating fresh instances
    only improves evaluation validity if the instance generation process produces
    tasks that are equivalent in difficulty and distribution to the tasks of interest;
    procedurally generated benchmarks in particular may produce artificial tasks that
    lack the pragmatic complexity, ambiguity, and real-world distribution of organic
    task instances, creating new evaluation validity problems even as they solve the
    contamination problem.
- type: warning
  title: Common pitfall regarding Dynamic Benchmarking
  body: Dynamic benchmarking approaches that generate evaluation instances using LLMs
    introduce a circularity problem — the evaluation instances are generated by a
    model that has the same distributional biases as the models being evaluated, potentially
    creating an evaluation environment where all models score well on LLM-generated
    instances because LLM-generated tasks implicitly match the LLM's competence profile;
    reliable dynamic benchmarking requires human oversight of generated instance quality
    and diversity, particularly for evaluating capabilities that require human-level
    judgment to assess.
