callouts:
- type: definition
  title: Evolutionary Prompt Optimization
  body: Evolutionary Prompt Optimization applies evolutionary algorithm principles
    — selection, crossover, and mutation — to the search for optimal prompt templates,
    maintaining a population of candidate prompts that are evaluated on a fitness
    function (task performance), recombined, and mutated across generations to progressively
    discover higher-performing prompt formulations.
- type: key-claim
  title: Key claim about Evolutionary Prompt Optimization
  body: Evolutionary Prompt Optimization handles non-convex, discontinuous prompt
    fitness landscapes more effectively than greedy hill-climbing because the population-based
    search maintains diversity and can escape local optima through crossover operations
    that combine beneficial features from multiple independently-developed candidate
    prompts — a qualitative advantage that greedy methods cannot replicate by construction.
- type: warning
  title: Common pitfall regarding Evolutionary Prompt Optimization
  body: Evolutionary Prompt Optimization has high computational cost because evaluating
    each member of a population requires forward passes on a validation set across
    potentially hundreds of generations; the total evaluation budget can reach thousands
    of model calls, making it cost-prohibitive for large models or large validation
    sets, and practitioners must carefully balance population size against the number
    of generations to stay within budget.
