callouts:
- type: definition
  title: Secrets Management
  body: Secrets Management is the security discipline concerned with the storage,
    distribution, rotation, audit, and revocation of credentials — API keys, database
    passwords, certificates, signing keys, OAuth tokens — so that secrets are never
    embedded in source, never durably present on developer workstations beyond necessity,
    and always discoverable to legitimate consumers via authenticated retrieval rather
    than hard-coded reference.
- type: key-claim
  title: Key claim about Secrets Management
  body: 'Secrets Management''s central engineering contribution is the separation
    of secret-distribution policy from application code: when secrets are retrieved
    at runtime from a managed store via an authenticated identity, rotation, revocation,
    and audit become operations against the store rather than against the codebase,
    which collapses what was previously a multi-team multi-week change into a single
    administrative action.'
- type: warning
  title: Common pitfall regarding Secrets Management
  body: Secrets Management failures are often catastrophic and frequently invisible
    until exploited, with the most common failure modes being secrets committed to
    public source control, secrets stored in environment files checked into version
    control, and overly broad service identities that expand the blast radius of any
    compromised credential; the standard mitigations (pre-commit secret scanning,
    scoped service identities, mandatory rotation) are individually cheap but collectively
    neglected.
