callouts:
- type: definition
  title: Query Rewriting for Retrieval
  body: 'Query rewriting for retrieval is the process of transforming a user''s original
    query into a form more suitable for retrieving relevant documents, using an LLM
    to expand, rephrase, decompose, or augment the query based on knowledge of what
    makes queries retrieval-friendly. Rewriting strategies include: HyDE (Hypothetical
    Document Embeddings — generating a hypothetical answer document and using its
    embedding for retrieval), multi-query expansion (generating multiple paraphrases
    of the query and retrieving for each), step-back prompting (rephrasing the specific
    query as a more general question to retrieve background knowledge), and query
    decomposition (splitting complex multi-hop queries into sequential simpler subqueries).
    Query rewriting addresses the vocabulary mismatch between user queries and document
    language.'
- type: key-claim
  title: Key claim about Query Rewriting for Retrieval
  body: Query rewriting via HyDE provides the largest retrieval quality improvement
    for knowledge-intensive questions where the user's query vocabulary differs substantially
    from the vocabulary of relevant documents — generating a hypothetical answer to
    the query and retrieving documents similar to that answer rather than to the raw
    query aligns the retrieval distribution with document language, and the improvement
    is largest for the queries where vocabulary mismatch is most severe (queries using
    lay terminology to ask about technical concepts).
- type: warning
  title: Common pitfall regarding Query Rewriting for Retrieval
  body: Query rewriting introduces latency overhead (requiring an additional LLM call
    before retrieval) and hallucination risk (the hypothetical document or paraphrase
    generated by the rewriter may introduce incorrect terms that retrieve irrelevant
    documents) — rewriting strategies that generate incorrect hypothetical content
    can actively degrade retrieval quality relative to no rewriting, particularly
    for queries where the LLM's knowledge of the topic is limited; query rewriting
    effectiveness should be validated on the specific query distribution before deploying
    as a standard pre-retrieval step.
