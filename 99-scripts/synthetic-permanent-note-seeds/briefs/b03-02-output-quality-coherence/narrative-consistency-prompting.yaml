callouts:
- type: definition
  title: Narrative Consistency Prompting
  body: Narrative Consistency Prompting refers to the set of prompting strategies
    and architectural techniques designed to maintain coherent character behaviour,
    plot logic, causal continuity, and world-state consistency across long-form narrative
    outputs generated by large language models. Narrative consistency encompasses
    factual consistency (a character's age, name, and attributes remain stable across
    the narrative), behavioural consistency (characters act in ways that are coherent
    with their established motivations and personality), causal consistency (events
    follow from established causes in the narrative world), and temporal consistency
    (the ordering and timing of events is internally coherent). Without explicit consistency
    management, LLMs generating long narratives frequently contradict previously established
    facts, change character attributes without narrative motivation, and introduce
    causal impossibilities.
- type: key-claim
  title: Key claim about Narrative Consistency Prompting
  body: Narrative Consistency Prompting requires explicit external consistency management
    at scale — LLMs cannot maintain narrative consistency through in-context attention
    alone for narratives exceeding their effective context window, because even within
    the context window the primacy-recency effect causes early-established narrative
    facts to be underweighted relative to recently generated content; effective production
    narrative systems maintain an explicit consistency database (character sheets,
    world-state dictionaries, event timelines) that is refreshed into the context
    at regular generation checkpoints, treating narrative consistency as an external
    state management problem rather than a model capability problem.
- type: warning
  title: Common pitfall regarding Narrative Consistency Prompting
  body: Narrative Consistency Prompting that relies solely on explicit consistency
    instructions in the prompt (e.g., "maintain consistent character behaviour as
    described above") provides only weak consistency enforcement — models will acknowledge
    such instructions and then generate inconsistencies anyway when the relevant context
    is distant in the window or when the inconsistency produces locally more fluent
    text; robust narrative consistency requires active detection of consistency violations
    through a separate verification pass followed by rewriting inconsistent segments,
    not prevention through instruction alone.
