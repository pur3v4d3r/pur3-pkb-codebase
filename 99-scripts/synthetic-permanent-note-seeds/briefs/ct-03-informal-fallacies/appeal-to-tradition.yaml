callouts:
- type: definition
  title: Appeal To Tradition
  body: The Appeal To Tradition is the fallacy of inferring that a practice, belief,
    or institution is correct, good, or true on the grounds that it has been long-established
    or widely accepted historically.
- type: key-claim
  title: Key claim about Appeal To Tradition
  body: The Appeal To Tradition treats temporal persistence as evidential warrant,
    but persistence is consistent with both adaptive selection and inertia; without
    an independent argument that the persistence tracks correctness, the inference
    has no force.
- type: warning
  title: Common pitfall regarding Appeal To Tradition
  body: The Appeal To Tradition is not equivalent to citing tradition as relevant
    context; longstanding practices may carry useful information about what has worked,
    and noting this is not fallacious provided the inference does not collapse "old"
    into "right."
