callouts:
- type: definition
  title: Clarification Request Generation
  body: 'Clarification request generation is the capability of a dialogue system to
    identify when an input is ambiguous or underspecified and to generate targeted
    clarifying questions that efficiently resolve the ambiguity with minimal burden
    on the user. Good clarification requests are: specific (targeting a single ambiguity
    rather than asking a generic "Can you clarify?"), informative (the answer to the
    question would significantly change the system''s response), user-friendly (phrased
    in natural language at the user''s register rather than exposing internal system
    ambiguities), and sequentially optimal (asking the highest-information clarifying
    question first to minimise the number of exchanges required). In LLM dialogue
    systems, clarification request generation is typically achieved through prompting
    instructions combined with demonstrations of well-formed clarification requests.'
- type: key-claim
  title: Key claim about Clarification Request Generation
  body: The quality of clarification request generation depends critically on the
    model's ability to represent its own uncertainty about the user's intent — models
    that are well-calibrated about their interpretative uncertainty generate targeted,
    specific clarification requests for genuinely ambiguous inputs, while overconfident
    models proceed with their assumed interpretation and fail to request clarification
    even when it is needed, producing a systematic relationship between model calibration
    and dialogue repair quality.
- type: warning
  title: Common pitfall regarding Clarification Request Generation
  body: 'Clarification request generation must be bounded by deployment context: in
    single-turn API interfaces, requesting clarification delays task completion and
    may be impossible if the interface does not support multi-turn interaction; in
    automated pipelines, clarification requests stall processing; and in time-sensitive
    applications, asking for clarification may be worse than proceeding with the most
    probable interpretation — the decision to generate a clarification request versus
    proceeding with an assumption should be a function of the ambiguity severity,
    the cost of an incorrect response, and the cost of the clarification exchange.'
