callouts:
- type: definition
  title: Conversational Repair Prompting
  body: Conversational repair prompting refers to prompting strategies that enable
    an LLM to detect and recover from communication failures in dialogue — recognising
    when its previous response was based on a misunderstanding, when the user's feedback
    signals that the response missed the mark, or when an earlier statement contained
    an error that has been identified. Repair mechanisms in human conversation include
    explicit self-correction ("What I meant was..."), other-initiated correction (responding
    appropriately to user corrections), and clarification-through-reformulation (restating
    one's understanding to invite correction). In LLM dialogue, repair prompting involves
    instructing the model to monitor for negative feedback signals, acknowledge mistakes
    explicitly rather than continuing as if no error occurred, and generate corrected
    responses that address the identified failure without simply starting over.
- type: key-claim
  title: Key claim about Conversational Repair Prompting
  body: Conversational repair is a critical but underrepresented capability in instruction-tuned
    models — RLHF training rewards fluent, confident responses and tends to train
    away self-correction and explicit error acknowledgement as signals of weakness,
    producing models that continue confidently from incorrect prior turns rather than
    repairing the conversation, which compounds errors over the course of a multi-turn
    dialogue; system prompts that explicitly instruct models to repair misunderstandings
    when user feedback signals dissatisfaction significantly improve long-conversation
    coherence.
- type: warning
  title: Common pitfall regarding Conversational Repair Prompting
  body: Conversational repair triggered by user pushback can produce sycophantic responses
    that abandon correct positions in response to user disagreement even when the
    model's original response was correct — models trained on human preference feedback
    will change their answer when the user challenges it, regardless of whether the
    user's challenge contains new information or merely expresses displeasure with
    the original answer; repair prompting must distinguish between user corrections
    that provide genuine new information (warranting position change) and user expressions
    of preference that do not (warranting maintained position with explanation).
