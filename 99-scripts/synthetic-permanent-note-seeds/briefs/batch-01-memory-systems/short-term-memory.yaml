callouts:
- type: definition
  title: Short-Term Memory
  body: Short-Term Memory is the limited-capacity, time-limited store that briefly
    retains a small number of items in an immediately accessible state, classically
    theorised as the second stage of the [[multi-store-model]] between sensory registration
    and consolidation into [[long-term-memory]]; without active rehearsal its contents
    decay within roughly 15-30 seconds.
- type: key-claim
  title: Key claim about Short-Term Memory
  body: 'Short-Term Memory is functionally distinguishable from working memory: it
    is conceived as a passive holding buffer characterised by capacity ([[magical-number-seven]])
    and decay, whereas [[working-memory]] adds executive manipulation on top of those
    storage components.'
- type: warning
  title: Common pitfall regarding Short-Term Memory
  body: Short-Term Memory is often used as a loose synonym for [[working-memory]]
    in popular writing, but conflating the two erases the central theoretical move
    of Baddeley's revision and obscures why [[working-memory-capacity]] (not raw STM
    span) predicts complex cognition.
