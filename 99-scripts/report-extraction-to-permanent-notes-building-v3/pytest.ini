# pytest config for v3 pipeline
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    llm: marks tests that require Ollama running locally
    cuda: marks tests that require CUDA-enabled torch
